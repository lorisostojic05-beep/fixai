<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fixi — Nessuna connessione</title>
  <!--
    Pagina mostrata dall'app quando non riesce a raggiungere il sito
    (collegata tramite "errorPath" in capacitor.config.json).

    Deve funzionare SENZA RETE: niente caratteri tipografici esterni, niente
    immagini da scaricare, niente librerie. Tutto quello che serve sta qui
    dentro, logo compreso, disegnato in SVG.
  -->
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #FAF8F3;
      color: #1C1C1A;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }
    .riquadro {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .marchio {
      font-size: 26px;
      font-weight: 800;
      color: #0F6E56;
      letter-spacing: -0.5px;
      margin: 14px 0 22px;
    }
    h1 {
      font-size: 21px;
      line-height: 1.35;
      margin: 0 0 10px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #5C5C58;
      margin: 0 0 26px;
    }
    button {
      width: 100%;
      background: #0F6E56;
      color: #fff;
      border: 0;
      border-radius: 100px;
      padding: 15px 24px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
    }
    button:active { background: #0B5442; }
    .nota {
      font-size: 13px;
      color: #8A8A85;
      margin: 18px 0 0;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="riquadro">
    <svg viewBox="0 0 100 100" width="76" height="76" role="img" aria-label="Fixi">
      <circle cx="42" cy="42" r="26" fill="none" stroke="#0F6E56" stroke-width="9" />
      <path d="M31 43 l8 8 16-18" fill="none" stroke="#0F6E56" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round" />
      <line x1="61" y1="61" x2="80" y2="80" stroke="#0F6E56" stroke-width="9"
            stroke-linecap="round" />
    </svg>

    <div class="marchio">Fixi</div>

    <h1>Nessuna connessione</h1>
    <p>
      Fixi ha bisogno di internet per la videodiagnosi.
      Controlla il wi-fi o i dati del telefono, poi riprova.
    </p>

    <button type="button" onclick="riprova()">Riprova</button>

    <p class="nota" id="nota"></p>
  </div>

  <script>
    var SITO = "https://fixai-svq7.vercel.app";

    function riprova() {
      document.getElementById("nota").textContent = "Sto riprovando…";
      window.location.replace(SITO);
    }

    // Se la connessione torna da sola mentre la pagina è aperta, rientriamo
    // nell'app senza far toccare niente all'utente.
    window.addEventListener("online", riprova);
  </script>
</body>
</html>
